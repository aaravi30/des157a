    <script>

    //LOOP
    //SEQUENCE STEP 1: START LOOP
    for (var i=1; i<8; i++){
        //SELECTION
        //SEQUENCE STEP 2: CHECK IF ANY OF THESE THINGS ARE TRUE TO SHOW UP IN THE CONSOLE
        if(i===1){
            console.log('#');
        } 
        else if(i===2){
            console.log('##');
        } 
        else if(i===3){
            console.log('###');
        } 
        else if(i===4){
            console.log('####');
        } 
        else if(i===5){
            console.log('#####');
        } 
        else if(i===6){
            console.log('######');
        } 
        else if(i===7){
            console.log('#######');
        } 
    } 
       
    </script>
