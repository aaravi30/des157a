
<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Basic JavaScript Slideshow</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text&family=Meie+Script&display=swap" rel="stylesheet">
    <script src="script.js" defer></script>
</head>

<body>
    <h1>Life is short</h1>
    <div id="skullPart">
        <img src="images/skull.png" alt="skull" id="skull" width="536" height="600">
    </div>

    <div id="otherImages">
        <img src="images/leftEar.jpg" alt="leftEar" id="leftEar" width="158" height="212">
        <img src="images/rightEar.jpg" alt="rightEar" id="rightEar" width="158" height="212">
        <img src="images/nose.jpg" alt="nose" id="nose" width="200" height="130">
    </div>

    <div id="text">
        <h1>Get the piercing</h1>
    </div>

    <h2>I play around with different jewelry</h2>
    <p>I really like wearing jhumkis or jhumkas, which are a type of Indian earring because I think they are beautiful and I like wearing them to embrace my culture. Here is some of my jhuka collection.</p>

    <div id="myimage">
        <img src="images/ear1.jpg" alt="slideshow image" id="myimage">
    </div>
    <button id="previous">previous</button> <button id="next">next</button>

</body>

</html>
