<body>
    <h1>Experiment 1</h1>
    <h2>Hi there :). Want to see a cool hashtag pattern? Right click and press inspect. Then press console!
    <script>
        /*var hashtag = '';
        //loop

    //sequence
    //loop 
    for (var i=1; i<8; i++){
        //selection
        if(i===1){
            console.log('#');
        } // end if
        else if(i===2){
            console.log('##');
        } //end if else
        else if(i===3){
            console.log('###');
        } //end if else
        else if(i===4){
            console.log('####');
        } //end if else
        else if(i===5){
            console.log('#####');
        } //end if else
        else if(i===6){
            console.log('######');
        } //end if else
        else if(i===7){
            console.log('#######');
        } //end if else
    } // end for loop 
       
    </script>
</body>
