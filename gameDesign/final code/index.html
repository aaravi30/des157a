<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Game On Project</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Donegal+One&family=Limelight&family=Miss+Fajardose&display=swap" rel="stylesheet">
    <script src="script.js" defer></script>
</head>

<body>
    <div id="header">
        <h1>Game of</h1>
        <h2>Pig</h2>
    </div>

    <div id="music">
        <button id="play">play music</button>
    </div>

    <div id="game">
		<p>ROLLING FOR PLAYER 1</p>
        <div class="dice">
            <img src="images/number3.png" alt="number 3">
            <img src="images/number4.png" alt="number 4">
        </div>
	</div>
        
    <div id="action">
        <button id="roll">roll</button>
    </div>

    <h3>Score</h3>

    <div id="score">
        <div class="scoring">
            <p>PLAYER 1</p>
            <h4>7</h4>
        </div>

        <div class="scoring">
            <p>PLAYER 2</p>
            <h4>0</h4>
        </div>
    </div>

    <footer>
        <a href="https://pixabay.com/sound-effects/film-special-effects-button-press-382713/">roll button sound</a>
    
        <a href="https://pixabay.com/music/traditional-jazz-sensual-jazz-60sec-177562/">music sound</a>
    </footer>

</body>

</html>
